app = "healthflow-api-abheet19"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "5000"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Traffic on this app is low/bursty (personal project, not a production
  # service under constant load) - keeping a machine always warm just to
  # avoid Socket.IO cold starts isn't worth the standing cost. The frontend
  # already runs with min_machines_running = 0; match it here too.
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
