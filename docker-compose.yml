services:
  db:
    image: postgres:17-alpine
    container_name: doctor_report_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${HEALTHFLOW_DB_PASSWORD:-healthflow-local-db}
      POSTGRES_DB: doctor_reports
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doctor_reports"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: doctor_report_backend
    ports:
      - "5000:5000"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${HEALTHFLOW_DB_PASSWORD:-healthflow-local-db}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: doctor_reports
      HEALTHFLOW_ACCESS_CODE: ${HEALTHFLOW_ACCESS_CODE:-synthetic-local-test}
      HEALTHFLOW_DEFAULT_CLINIC_ID: ${HEALTHFLOW_DEFAULT_CLINIC_ID:-demo}
      HEALTHFLOW_DEFAULT_USER_ID: ${HEALTHFLOW_DEFAULT_USER_ID:-demo-user}
      HEALTHFLOW_IDENTITIES_JSON: ${HEALTHFLOW_IDENTITIES_JSON:-}
      HEALTHFLOW_REQUIRE_ACCESS_CODE: "true"
      CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:5179
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://127.0.0.1:5000
        VITE_SOCKET_URL: http://127.0.0.1:5000
        VITE_HEALTHFLOW_CLINIC_ID: ${HEALTHFLOW_DEFAULT_CLINIC_ID:-demo}
        VITE_HEALTHFLOW_USER_ID: ${HEALTHFLOW_DEFAULT_USER_ID:-demo-user}
    container_name: doctor_report_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
