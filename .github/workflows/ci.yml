name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check source whitespace
        run: git show --check --oneline --format=fuller HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check backend dependency compatibility
        run: python -m pip check
      - name: Run backend unit tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

  synthetic-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install browser verifier
        working-directory: tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build and start the production containers
        env:
          HEALTHFLOW_REVISION: ${{ github.sha }}
        run: docker compose up --build --detach
      - name: Wait for the database-aware API health probe
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Verify both containers identify the exact source
        shell: bash
        run: |
          test "$(curl --fail --silent http://127.0.0.1:5000/health | jq --raw-output .release)" = "$GITHUB_SHA"
          test "$(curl --fail --silent http://127.0.0.1:3000/release.json | jq --raw-output .release)" = "$GITHUB_SHA"
      - name: Record the complete five-department flow
        working-directory: tools
        env:
          BASE_URL: http://127.0.0.1:3000
          API_URL: http://127.0.0.1:5000
        run: node record-demo.mjs
      - name: Verify workflows, 320px navigation, accessibility, and failure recovery
        working-directory: tools
        env:
          BASE_URL: http://127.0.0.1:3000
        run: npm run verify
      - name: Verify bounded database outage and recovery
        shell: bash
        run: |
          mkdir -p docs/verification
          docker compose stop db
          outage_started=$(date +%s%3N)
          outage_status=$(curl --silent --output /tmp/health-outage.json --write-out '%{http_code}' --max-time 5 http://127.0.0.1:5000/health)
          outage_ms=$(($(date +%s%3N) - outage_started))
          test "$outage_status" = "503"
          test "$(jq --raw-output .database /tmp/health-outage.json)" = "unavailable"
          test "$(jq --raw-output .release /tmp/health-outage.json)" = "$GITHUB_SHA"
          docker compose start db
          recovered=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/health >/tmp/health-recovered.json; then
              recovered=true
              break
            fi
            sleep 1
          done
          test "$recovered" = "true"
          test "$(jq --raw-output .release /tmp/health-recovered.json)" = "$GITHUB_SHA"
          jq --null-input \
            --arg at "$(date --iso-8601=seconds)" \
            --argjson outageMs "$outage_ms" \
            --arg release "$GITHUB_SHA" \
            '{at: $at, release: $release, outageStatus: 503, outageMs: $outageMs, recoveryStatus: 200}' \
            > docs/verification/database-recovery-results.json
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthflow-acceptance-evidence
          if-no-files-found: warn
          path: |
            tools/.frames/manifest.json
            tools/.frames/patient-id.txt
            tools/.frames/Demo Patient's Report.docx
            docs/verification/*.json
            docs/verification/*.png
            docs/screenshots/mobile-navigation.png
      - name: Print container logs after failure
        if: failure()
        run: docker compose logs
      - name: Stop the production containers
        if: always()
        run: docker compose down
