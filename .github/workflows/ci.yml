name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check backend dependency compatibility
        run: python -m pip check
      - name: Run backend unit tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

  synthetic-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install browser verifier
        working-directory: tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build and start the production containers
        run: docker compose up --build --detach
      - name: Wait for the database-aware API health probe
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Record the complete five-department flow
        working-directory: tools
        env:
          BASE_URL: http://127.0.0.1:3000
          API_URL: http://127.0.0.1:5000
        run: node record-demo.mjs
      - name: Verify workflows, mobile navigation, and route recovery
        working-directory: tools
        env:
          BASE_URL: http://127.0.0.1:3000
        run: npm run verify
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthflow-acceptance-evidence
          if-no-files-found: warn
          path: |
            tools/.frames/manifest.json
            tools/.frames/patient-id.txt
            tools/.frames/Demo Patient's Report.docx
            docs/verification/*.json
            docs/verification/*.png
            docs/screenshots/mobile-navigation.png
      - name: Print container logs after failure
        if: failure()
        run: docker compose logs
      - name: Stop the production containers
        if: always()
        run: docker compose down
